name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Test failures are reported as check annotations
  checks: write

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One runner per platform Deno publishes builds for. Java 8 is the oldest version the library supports and
          # also runs Gradle; Temurin has no Java 8 build for ARM macOS, Zulu does. Nobody ships Java 8 for ARM
          # Windows, so that runner uses Java 17 to test the native ARM64 Deno build.
          - name: Linux x64
            os: ubuntu-latest
            distribution: temurin
            java: 8
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            distribution: temurin
            java: 8
          - name: Windows x64
            os: windows-latest
            distribution: temurin
            java: 8
          - name: Windows ARM64 (Java 17)
            os: windows-11-arm
            distribution: zulu
            java: 17
          - name: macOS ARM64
            os: macos-latest
            distribution: zulu
            java: 8
          - name: macOS x64
            os: macos-15-intel
            distribution: temurin
            java: 8
          # Newer Minecraft versions run on Java 21
          - name: Linux x64 (Java 21)
            os: ubuntu-latest
            distribution: temurin
            java: 21

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Integration tests
        run: ./gradlew integrationTest --stacktrace

      # Forge and NeoForge start Minecraft with java.net.preferIPv6Addresses set
      - name: Integration tests preferring IPv6
        run: ./gradlew ipv6Test --stacktrace

      - name: Report test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: build/test-results/**/*.xml
          check_name: Test results (${{ matrix.name }})
          detailed_summary: true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-java${{ matrix.java }}
          path: build/reports/tests/

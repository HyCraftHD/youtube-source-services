name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One runner per platform Deno publishes builds for. Java 8 is the oldest version the library supports and
          # also runs Gradle; Temurin has no Java 8 builds for ARM macOS and Windows, Zulu does.
          - name: Linux x64
            os: ubuntu-latest
            distribution: temurin
            java: 8
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            distribution: temurin
            java: 8
          - name: Windows x64
            os: windows-latest
            distribution: temurin
            java: 8
          - name: Windows ARM64
            os: windows-11-arm
            distribution: zulu
            java: 8
          - name: macOS ARM64
            os: macos-latest
            distribution: zulu
            java: 8
          - name: macOS x64
            os: macos-15-intel
            distribution: temurin
            java: 8
          # Newer Minecraft versions run on Java 21
          - name: Linux x64 (Java 21)
            os: ubuntu-latest
            distribution: temurin
            java: 21

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Integration tests
        run: ./gradlew integrationTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-java${{ matrix.java }}
          path: build/reports/tests/

# Everything that is downloaded or tuned at runtime. Placeholders in {braces} are filled in by the code.

# Deno
deno.version=v2.9.8
deno.url=https://github.com/denoland/deno/releases/download/{version}/deno-{target}.zip
deno.checksum-url={url}.sha256sum

# Services are downloaded as GitHub archives at a fixed commit
github.archive-url=https://codeload.github.com/{repository}/zip/{commit}

# Bump yt-cipher.commit and ejs.commit together: yt-cipher's Dockerfile names the ejs commit it expects (EJS_COMMIT).
yt-cipher.repository=kikkia/yt-cipher
yt-cipher.commit=1e1fd8e2f34ca90cf23545be72e46307bd3d3d2a
yt-cipher.ready-marker=Server listening on
# yt-cipher imports these without a version, which would always resolve to the latest release. Comma-separated.
# ejs's npm dependencies need no entry here, their versions are read from its package.json.
yt-cipher.pinned-imports=jsr:@std/cache@0.2.4
ejs.repository=yt-dlp/ejs
ejs.commit=cd4e87f52e87ab6d8b318fd3a817adda6fafa8dc

webpo-generator.repository=ashton045/webpo-generator
webpo-generator.commit=421ecfeb573a15e825b52fe6913bf6e70623143a
webpo-generator.ready-marker=api listening on

# How long a start waits for a service to accept requests. Downloads are not included, but loading many npm files can
# take long on slow disks or with an antivirus scanning each file.
start-timeout-seconds=300
# Restarts after a crash before giving up; 0 disables restarting. The count resets after a minute of stable uptime.
restart.max-attempts=5
